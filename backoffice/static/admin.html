
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBntory — Administration</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <header class="topbar">
    <div class="wordmark">HBNTORY</div>
    <nav class="topnav">
    </nav>
  </header>

  <main class="page">
    <h1>Administration</h1>

    <section class="ticket">
      <p class="ticket-label">Branches</p>
      <div id="branch-list" class="branch-list"></div>
      <form id="branch-form" class="inline-form">
        <input type="text" id="branch-name" placeholder="Nom de la nouvelle branche" required>
        <button type="submit" class="add">Créer la branche</button>
      </form>
    </section>

    <section class="ticket">
      <p class="ticket-label">Utilisateurs (managers)</p>
      <div id="user-list" class="user-list"></div>
      <form id="user-form" class="inline-form user-form">
        <input type="text" id="user-username" placeholder="Identifiant" required>
        <input type="password" id="user-password" placeholder="Mot de passe initial" required>
        <select id="user-branch" required></select>
        <button type="submit" class="add">Créer l'utilisateur</button>
      </form>
    </section>
  </main>

  <footer class="footbar">
    <span>© 2026 HBntory</span>
    <a href="#">Legal</a>
  </footer>

  <script src="/static/admin.js"></script>
</body>
</html>
