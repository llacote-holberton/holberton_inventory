<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant Produits &amp; Stock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <h1>Assistant Produits &amp; Stock</h1>
    <p class="subtitle">Pose une question, par exemple : "Quel magasin a du stock du produit X ?"</p>
    <div id="messages" class="messages"></div>
    <form id="chat-form">
      <input id="question" type="text" placeholder="Pose ta question..." autocomplete="off" required>
      <button type="submit">Envoyer</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
